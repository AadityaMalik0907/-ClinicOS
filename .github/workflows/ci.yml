name: ClinicOS checks

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Django system and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Production configuration check
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-secret-value-not-for-deployment"
          FIELD_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          DATABASE_URL: "postgresql://clinicos:ci-only@127.0.0.1:5432/clinicos"
          DJANGO_ALLOWED_HOSTS: "ci.example.test"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://ci.example.test"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "86400"
      - name: Django tests
        run: python manage.py test
