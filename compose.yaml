services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicos}
      POSTGRES_USER: ${POSTGRES_USER:-clinicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicos-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicos} -d ${POSTGRES_DB:-clinicos}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicos}
      POSTGRES_USER: ${POSTGRES_USER:-clinicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicos-dev}
      POSTGRES_HOST: db
      DB_ENGINE: postgres
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
